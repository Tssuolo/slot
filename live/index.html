<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>무료슬롯 - 최신 온라인 슬롯 게임 모음</title>

  <!-- CSS -->
  <link href="./templatemo-glossy-touch.css" rel="stylesheet"/>

  <style>
    /* 홈 기능 박스 */
    .features {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 10px 0;
      text-align: center;
      position: sticky;
      top: 0;
      background: #000; /* 배경 지정 */
      z-index: 1000;
    }

    .features .feature-card {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 15px;
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* 영상 박스 (고정 아님) */
    .player-sticky {
      width: 50%;
      max-width: 1300px;
      margin: 20px auto;
      aspect-ratio: 16 / 9;
      position: relative;
      z-index: 1;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .player-sticky iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .features {
        grid-template-columns: repeat(2, 1fr);
        padding: 5px 0;
      }

      .player-sticky {
        width: 100% !important;
        margin: 10px 0;
        border-radius: 0;
        aspect-ratio: auto;
        height: auto;
      }

      .player-sticky iframe {
        width: 100%;
        height: auto;
        min-height: 220px;
      }

      input, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>

<body>

  <!-- 고정된 홈 박스 4개 -->
  <section class="features" id="homeSection">
    <div>
      <a href="https://tssuolo.github.io/slot/index.html">
        <div class="feature-card glass" style="background-image: url('images/olim.gif');"></div>
      </a>
      <div style="margin-top: 8px; font-size: 20px; font-weight: bold; color: white;">HOME</div>
    </div>

    <div>
      <a href="https://tssuolo.github.io/slot/live/" target="_blank">
        <div class="feature-card glass" style="background-image: url('images/spinning-youtube.gif');"></div>
      </a>
      <div style="margin-top: 8px; font-size: 20px; font-weight: bold; color: white;">유튜브</div>
    </div>

    <div>
      <a href="https://t.me/ARSLOT7" target="_blank">
        <div class="feature-card glass" style="background-image: url('images/tltl.gif'); background-size: contain; background-repeat: no-repeat;
                        background-position: center; width: 250px; height: 150px; border-radius: 15px; overflow: hidden; position: relative;"></div>
      </a>
      <div style="margin-top: 8px; font-size: 20px; font-weight: bold; color: white;">텔레호출</div>
    </div>

    <div>
      <a href="https://open.kakao.com/o/s8V1ltRh" target="_blank">
        <div class="feature-card glass" style="background-image: url('images/kakao.gif'); background-size: contain; background-repeat: no-repeat;
                        background-position: center; width: 250px; height: 150px; border-radius: 15px; overflow: hidden; position: relative;"></div>
      </a>
      <div style="margin-top: 8px; font-size: 20px; font-weight: bold; color: white;">카톡문의</div>
    </div>
  </section>

  <!-- 유튜브 영상 -->
  <div class="player-sticky">
    <iframe
      src="https://www.youtube.com/embed/8NOg-ArPOiE"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="player-sticky">
    <iframe
      src="https://youtu.be/LjDz4tnxOq4"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <div class="player-sticky">
    <iframe
      src="https://youtu.be/eGANQArWqck"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>


</body>
</html>
